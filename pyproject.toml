[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "snrcps"
version = "0.2.0"
description = "Self-normalized risk-controlling prediction sets under unknown temporal dependence"
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
authors = [
  {name = "Enrico Bignozzi"}
]
keywords = [
  "conformal prediction",
  "risk control",
  "time series",
  "self-normalization",
  "prediction intervals"
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Scientific/Engineering :: Mathematics"
]
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
experiments = [
  "pandas>=2.2",
  "matplotlib>=3.8",
  "scikit-learn>=1.5",
  "scipy>=1.13",
  "statsmodels>=0.14"
]
test = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/ENRICOBIGNOZZI/MACHINE-LEARNING"
Repository = "https://github.com/ENRICOBIGNOZZI/MACHINE-LEARNING"
Issues = "https://github.com/ENRICOBIGNOZZI/MACHINE-LEARNING/issues"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
snrcps = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
