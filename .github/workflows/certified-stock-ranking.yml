name: Certified stock ranking

on:
  pull_request:
    paths:
      - "projects/certified-stock-ranking/**"
      - ".github/workflows/certified-stock-ranking.yml"
  push:
    branches:
      - main
    paths:
      - "projects/certified-stock-ranking/**"
      - ".github/workflows/certified-stock-ranking.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/certified-stock-ranking
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: projects/certified-stock-ranking/pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: pytest
