name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"
      - name: Run tests
        run: pytest
      - name: Compile Python sources
        run: python -m compileall -q code src tests examples

  figures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install experiment dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[experiments]"
      - name: Check plotting sources
        run: python -m compileall -q code/make_top_paper_figures.py code/plot_style.py
      - name: Verify manuscript figure assets
        run: |
          for asset in \
            simulation_risk_violation_by_rho \
            simulation_certification_diagnostics \
            first_order_qq \
            triggered_recertification_diagnostics \
            electricity_certification_revision \
            electricity_feature_dependence \
            co2_episodic_diagnostics \
            co2_selection_dependence; do
            test -f "figures/${asset}.pdf"
          done
      - name: Regenerate the complete suite when archival outputs are present
        shell: bash
        run: |
          if [[ -f tables/electricity_deployment_path.csv && -f tables/triggered_recertification_path.csv && -f tables/dependence_range_repetitions.csv ]]; then
            python code/make_top_paper_figures.py
            test "$(find figures -maxdepth 1 -name '*.pdf' | wc -l)" -eq 25
            test "$(find figures -maxdepth 1 -name '*.png' | wc -l)" -eq 25
          else
            echo "Raw archival trajectories are not part of the lightweight checkout; using committed vector assets."
          fi

  latex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile manuscript
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex
          latexmk_use_xelatex: false
          args: -pdf -file-line-error -halt-on-error -interaction=nonstopmode
