[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rankcert"
version = "0.1.0"
description = "Certified partial rankings and selective portfolio construction for monthly stock returns"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Enrico Bignozzi"}]
dependencies = [
  "numpy>=1.26", "pandas>=2.1", "scipy>=1.11", "scikit-learn>=1.4",
  "matplotlib>=3.8", "PyYAML>=6.0", "statsmodels>=0.14",
  "joblib>=1.3", "numba>=0.59"
]

[project.optional-dependencies]
wrds = ["SQLAlchemy>=2.0", "psycopg2-binary>=2.9", "openpyxl>=3.1", "wrds>=3.2"]
boosting = ["lightgbm>=4.3"]
parquet = ["pyarrow>=15"]
dev = ["pytest>=8", "ruff>=0.6", "mypy>=1.10"]

[project.scripts]
rankcert-synthetic = "rankcert.cli:synthetic_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
